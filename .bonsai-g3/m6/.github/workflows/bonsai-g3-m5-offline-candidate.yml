# G3-M5: ISOLATED CANDIDATE. NOT DEPLOYED TO GITHUB.
# This file is intentionally workflow_dispatch-only. No issue_comment, push,
# schedule, paid API, credentials, or public transcript upload.
# GitHub requires the workflow file to be registered on the default branch
# before this manual dispatch can work. Deployment is a separate owner gate.
name: BONSaY G3 M5 offline mock (candidate only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonsai-g3-m5-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-mock:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'Hiderock61' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BONSAI_G3_OFFLINE_MODE: offline_mock
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: ${{ github.workspace }}/g3
    steps:
      - name: Checkout only this revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Install only pytest (no SDK, no browser)
        run: python -m pip install --disable-pip-version-check 'pytest==9.0.2'
      - name: Validate pinned sources and existing regression tests
        run: python -m pytest -q g3 test_m5_contract.py
      - name: Run guarded three-generation offline mock A/B
        run: python m5_offline_runner.py --require-python311 --out m5_public_summary.json
      - name: Confirm final mode and status, print no transcript
        run: python m5_summary_check.py m5_public_summary.json

# Intentionally NO actions/upload-artifact, no GitHub Issue comments,
# no secret references, no OpenAI API calls, no browser logins.
