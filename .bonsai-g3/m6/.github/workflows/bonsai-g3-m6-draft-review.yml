# ISOLATED M6 CANDIDATE. Never deployed without a separate owner approval.
# A Draft PR on the exact named owner branch can be reviewed without merging.
# This workflow itself triggers only on label application, not PR creation.
# Other workflows ALREADY on GitHub may run for a new PR: audit separately.
name: BONSaY G3 M6 draft-PR owner-label offline QA candidate

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: bonsai-g3-m6-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  g3-m6-local-mock:
    if: >-
      ${{ github.event.action == 'labeled' &&
          github.event.label.name == 'bonsai-g3-m6-run-approved' &&
          github.actor == 'Hiderock61' &&
          github.event.pull_request.user.login == 'Hiderock61' &&
          github.event.pull_request.draft == true &&
          github.event.pull_request.head.repo.full_name == 'Hiderock61/minifish-v01' &&
          github.event.pull_request.base.repo.full_name == 'Hiderock61/minifish-v01' &&
          github.event.pull_request.head.ref == 'review/bonsai-g3-m6-20261115' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.base.sha == 'f16a39043111d0de224e793b43ab6917780a02f9' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BONSAI_G3_OFFLINE_MODE: offline_mock
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: ${{ github.workspace }}/g3
    steps:
      - name: Checkout only owner-reviewed PR HEAD with no saved git credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Install only pinned pytest for isolated offline QA
        run: python -m pip install --disable-pip-version-check 'pytest==9.0.2'
      - name: Check original M5 31-file content manifest before any mock
        run: python m6_integrity_check.py evidence/m5_file_sha256_manifest.json
      - name: Run original 118 regression cases plus isolated M6 contracts
        run: python -m pytest -q g3 test_m5_contract.py test_m6_contract.py
      - name: Execute A/B synthetic three-generation harness, no model API
        run: python m5_offline_runner.py --require-python311 --out m6_public_summary.json
      - name: Verify the bounded public-safe verdict
        run: python m5_summary_check.py m6_public_summary.json

# No pull_request_target, push, workflow_dispatch, issue_comment, schedule,
# release, secret, external model API, artifact upload or Issue write.
