name: MiniFish tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium for Playwright E2E
        run: python -m playwright install --with-deps chromium
      - name: Check remote-desktop script syntax
        run: bash -n start_auth_desktop.sh
      - name: Run tests
        run: PYTHONPATH=. pytest -q
