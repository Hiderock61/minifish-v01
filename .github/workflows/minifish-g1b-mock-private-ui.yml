name: MiniFish G1b private GUI mock login acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  headed-private-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing browser dependencies and Xvfb
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Verify mock-only private screen and encrypted Chromium relaunch
        env:
          MINIFISH_G1B_E2E: "1"
          MINIFISH_G1B_DEBUG_MOCK_CI: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x768x24" python -m pytest -q tests/test_g1b_mock_portal.py
