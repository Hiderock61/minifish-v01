name: Formula Bot C - G1 AI independent verification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: formula-bot-c-live-issue-14
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event.issue.number == 14 &&
      github.event.comment.user.login == 'Hiderock61' &&
      github.event.comment.body == '/formula-c-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Six offline math checks and secret presence ONLY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEANAI_API_KEY }}
        run: python formula-bot-c/g1_probe.py preflight
      - name: Return safe link to the owner
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/14/comments" \
            -f body="FORMULA_C_PREFLIGHT_RUN=$GITHUB_RUN_ID; paid_api_calls=0; [GitHub Actions result](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"

  live:
    if: >-
      github.event.issue.number == 14 &&
      github.event.comment.user.login == 'Hiderock61' &&
      github.event.comment.body == '/formula-c-live-three-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Secret gate and durable one-shot guard BEFORE API calls
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEANAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "BLOCKED: secret unavailable"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/issues/14/comments?per_page=100" > /tmp/formula-c-comments.json
          python - <<'PY'
          import json
          from pathlib import Path
          comments=json.loads(Path('/tmp/formula-c-comments.json').read_text())
          if any('FORMULA_C_LIVE_STARTED_RUN=' in c.get('body','') for c in comments):
              raise SystemExit('BLOCKED: this limited live probe was already attempted')
          PY
          gh api "repos/$GITHUB_REPOSITORY/issues/14/comments" \
            -f body="FORMULA_C_LIVE_STARTED_RUN=$GITHUB_RUN_ID (one-shot protection armed before first API attempt)"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Three live prompts x two independent test datasets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEANAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          FORMULA_C_LIVE_APPROVED: 'YES'
        run: python formula-bot-c/g1_probe.py live > /tmp/formula-c-result.json
      - name: Publish sanitized outcome only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('/tmp/formula-c-result.json')
          d=json.loads(f.read_text()) if f.is_file() else {}
          lines=[
            'FORMULA_C_G1_LIVE_STATE='+str(d.get('state','BLOCKED_OR_ERROR')),
            'cases='+str([(x.get('id'),x.get('state')) for x in d.get('cases',[])]),
            'max_api_attempts=3',
            'excel_verified=False',
            'No keys, raw AI outputs or user data posted.']
          Path('/tmp/formula-c-safe.md').write_text('\n'.join(lines))
          PY
          printf '\n[GitHub Actions evidence](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/formula-c-safe.md
          gh api "repos/$GITHUB_REPOSITORY/issues/14/comments" -f body="$(cat /tmp/formula-c-safe.md)"

  auth-check:
    if: >-
      github.event.issue.number == 14 &&
      github.event.comment.user.login == 'Hiderock61' &&
      github.event.comment.body == '/formula-c-key-auth-check'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check API authentication with GET models (no model generation)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEANAI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          token=os.environ.get('OPENAI_API_KEY','')
          status='NO_SECRET'
          if token:
              req=urllib.request.Request('https://api.openai.com/v1/models',
                  headers={'Authorization':'Bearer '+token},method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      status=str(resp.status)
              except urllib.error.HTTPError as exc:
                  status=str(exc.code)
              except Exception as exc:
                  status='NETWORK_OR_CLIENT_ERROR_'+type(exc).__name__
          Path('/tmp/formula-c-auth.txt').write_text(status)
          print('FORMULA_C_AUTH_HTTP='+status)
          PY
      - name: Report status only (no secret)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE="$(cat /tmp/formula-c-auth.txt 2>/dev/null || echo NOT_AVAILABLE)"
          gh api "repos/$GITHUB_REPOSITORY/issues/14/comments" \
            -f body="FORMULA_C_AUTH_HTTP=$CODE; model_generation_calls=0; [Actions evidence](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"

  model-check:
    if: >-
      github.event.issue.number == 14 &&
      github.event.comment.user.login == 'Hiderock61' &&
      github.event.comment.body == '/formula-c-model-check'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check model access with GET (no generation)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEANAI_API_KEY }}
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.error
          from pathlib import Path
          key=os.getenv('OPENAI_API_KEY','')
          code='NO_SECRET'
          if key:
              req=urllib.request.Request('https://api.openai.com/v1/models/gpt-4o-mini',
                  headers={'Authorization':'Bearer '+key},method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=15) as resp:code=str(resp.status)
              except urllib.error.HTTPError as ex:code=str(ex.code)
              except Exception as ex:code='NETWORK_'+type(ex).__name__
          Path('/tmp/c-model-code.txt').write_text(code)
          print('FORMULA_C_MODEL_HTTP='+code)
          PY
      - name: Write safe model check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE="$(cat /tmp/c-model-code.txt 2>/dev/null || echo UNKNOWN)"
          gh api "repos/$GITHUB_REPOSITORY/issues/14/comments" \
            -f body="FORMULA_C_MODEL_HTTP=$CODE; model_generation_calls=0; [Actions evidence](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
