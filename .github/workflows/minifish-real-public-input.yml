name: MiniFish real public input readback (no login, no submission)

on:
  pull_request:
    paths:
      - 'minifish/live_public_input.py'
      - '.github/workflows/minifish-real-public-input.yml'

permissions:
  contents: read

jobs:
  real-public-input:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing Chromium browser runtime
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Real docs.python.org search box input without submit
        env:
          OPENAI_API_KEY: ""
          OPENAI_MODEL: ""
        run: |
          PYTHONPATH=. python -m minifish.live_public_input
