name: MiniFish secret preflight - no AI API call

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: minifish-secret-preflight-13
  cancel-in-progress: false

jobs:
  verify-secret-alias:
    if: >-
      github.event.issue.number == 13 &&
      github.event.issue.user.login == 'Hiderock61' &&
      github.event.comment.user.login == 'Hiderock61' &&
      github.event.comment.body == '/ai-tower-secret-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check secret exists without outputting it
        env:
          # Existing correct name takes precedence over known typo.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEANAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          # Never print or write the key, a prefix, its length, or a hash.
          ready = bool(os.getenv("OPENAI_API_KEY"))
          result = {
              "status": "PASS" if ready else "BLOCKED",
              "gate": "KEY_PRESENT_ONLY",
              "normalized_env": "OPENAI_API_KEY" if ready else "MISSING",
              "openai_api_calls": 0,
              "billing_tested": False,
              "key_validity_tested": False,
              "exposed_key_rotated": "UNKNOWN",
          }
          Path("preflight.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )
          print("PREFLIGHT RESULT:", result["status"])
          print("No API request executed; secret material was not displayed.")
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("preflight.json").read_text(encoding="utf-8"))
          summary = "\n".join([
              "AI_TOWER_SECRET_PREFLIGHT=" + result["status"],
              "normalized_env=" + result["normalized_env"],
              "openai_api_calls=0",
              "key_validity=NOT_TESTED",
              "key_rotation=UNCONFIRMED",
              "No secret value was read back or included in this comment.",
          ])
          Path("comment.md").write_text(summary, encoding="utf-8")
          PY
          printf '\n[Execution evidence](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> comment.md
          gh api "repos/$GITHUB_REPOSITORY/issues/13/comments" -f body="$(cat comment.md)"
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("preflight.json").read_text())["status"]
          if state != "PASS":
              raise SystemExit("No configured Secret matched the allowed names")
          PY
