name: MiniFish G1 pre-login and no-auth typing (zero AI)

on:
  pull_request:
    paths:
      - 'minifish/prelogin.py'
      - 'minifish/form_draft.py'
      - 'tests/test_prelogin_ready.py'
      - 'tests/test_prelogin_noauth_fill_e2e.py'
      - 'tests/test_noauth_local_save_e2e.py'
      - '.github/workflows/minifish-prelogin-ready.yml'

permissions:
  contents: read

jobs:
  noauth-prelogin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing runtime and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test four fixed login gates and real no-auth form typing
        env:
          MINIFISH_PRELOGIN_E2E: '1'
          MINIFISH_LOCAL_SAVE_E2E: '1'
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_prelogin_ready.py \
            tests/test_prelogin_noauth_fill_e2e.py \
            tests/test_noauth_local_save_e2e.py
      - name: One-shot READ ONLY visit to four login entrances, no login
        run: |
          PYTHONPATH=. python - <<'PY'
          from minifish.prelogin import SITES, observe_login_only
          print("MINIFISH_PRELOGIN_GATE_READY=1")
          print("SAFE_STOP_BEFORE_CREDENTIALS=1")
          for key in SITES:
              result = observe_login_only(key)
              # Fixed allowlisted fields only, never raw HTML or cookies.
              print(result['site'] + ": " + result['status'] + " / " + result['reason'])
          print("credential_inputs=0, form_submits=0, external_writes=0, openai_calls=0")
          PY
