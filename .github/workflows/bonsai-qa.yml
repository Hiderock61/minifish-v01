name: MiniFish BONSaY UX QA

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: bonsai-qa-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  qa:
    if: >-
      github.event.issue.number == 6 &&
      github.event.comment.user.login == 'Hiderock61' &&
      (github.event.comment.body == '/bonsai-qa probe' || github.event.comment.body == '/bonsai-qa gemini')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEST_MODE: ${{ github.event.comment.body == '/bonsai-qa gemini' && 'gemini' || 'probe' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install free MiniFish browser runner
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test public BONSaY preview without manual copying
        run: python -m minifish.bonsai_qa --mode "$TEST_MODE"
      - name: Save whole test record and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-qa-${{ github.run_id }}
          path: bonsai_qa_run/
          retention-days: 7
          if-no-files-found: warn
      - name: Reply to QA issue with result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f bonsai_qa_run/report.md; then
            {
              cat bonsai_qa_run/report.md
              printf '\n\n[Actions evidence for this run](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            } > bonsai_qa_run/issue_comment.md
          else
            printf 'BONSaY QA worker failed before a report was produced. [Inspect run](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > bonsai_qa_fallback.md
            cp bonsai_qa_fallback.md bonsai_qa_run_issue_comment.md
          fi
          if test -f bonsai_qa_run/issue_comment.md; then
            gh api "repos/$GITHUB_REPOSITORY/issues/6/comments" -f body="$(cat bonsai_qa_run/issue_comment.md)"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/6/comments" -f body="$(cat bonsai_qa_run_issue_comment.md)"
          fi
