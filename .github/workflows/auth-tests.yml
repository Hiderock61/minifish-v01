name: MiniFish Auth Tests
on:
  pull_request:
  push:
    branches: [feat/auth-gate-v01]
jobs:
  auth-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium for local mock E2E
        run: python -m playwright install --with-deps chromium
      - name: Test auth gate and browser restart
        run: PYTHONPATH=. pytest -q tests/test_auth.py tests/test_auth_e2e.py
